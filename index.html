
<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b14">
  <title>GI Creative Space | స్వాగతం</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>
<body class="entrance-page">

  <main class="entrance-shell">
    <div class="entrance-background" aria-hidden="true"></div>
    <div class="entrance-shade" aria-hidden="true"></div>

    <header class="entrance-topbar">
      <a class="brand" href="index.html">
        <img class="brand-logo" src="assets/logo/gi-creative-space-logo.png" alt="GI Creative Space logo" onerror="this.style.display='none'">
        <span class="brand-copy">
          <span class="brand-name">GI Creative Space</span>
          <span class="brand-tagline">Five Worlds in One Space</span>
        </span>
      </a>

      <button class="language-toggle" type="button" data-language-toggle aria-label="Switch language">
        <span class="language-indicator">అ</span>
        <span data-language-label>English</span>
      </button>
    </header>

    <section class="entrance-content">
      <div class="cosmic-symbol" aria-hidden="true">
        <span class="cosmic-orbit orbit-one"></span>
        <span class="cosmic-orbit orbit-two"></span>
        <span class="cosmic-core">GI</span>
      </div>

      <p class="eyebrow" data-te="ఒకే వేదిక • ఐదు ప్రపంచాలు" data-en="ONE SPACE • FIVE WORLDS">
        ఒకే వేదిక • ఐదు ప్రపంచాలు
      </p>

      <h1>
        <span data-te="జ్ఞానానికి స్వాగతం" data-en="Welcome to a World of Knowledge">జ్ఞానానికి స్వాగతం</span>
        <span class="gold-text" data-te="సృజనకు స్వాగతం" data-en="Welcome to Possibility">సృజనకు స్వాగతం</span>
      </h1>

      <p class="entrance-description"
         data-te="ఆలోచనలు, సంస్కృతి, విద్య, సాంకేతికత, అన్వేషణ — ఐదు ప్రపంచాలను ఒకే చోట అనుభవించండి."
         data-en="Ideas, culture, education, technology and exploration — discover five worlds in one connected space.">
        ఆలోచనలు, సంస్కృతి, విద్య, సాంకేతికత, అన్వేషణ — ఐదు ప్రపంచాలను ఒకే చోట అనుభవించండి.
      </p>

      <form class="visitor-form" id="visitor-form">
        <label for="visitor-name"
               data-te="మీ పేరు నమోదు చేయండి"
               data-en="May we know your name?">
          మీ పేరు నమోదు చేయండి
        </label>

        <input
          id="visitor-name"
          name="visitor-name"
          type="text"
          autocomplete="name"
          maxlength="60"
          placeholder="మీ పేరు"
          data-placeholder-te="మీ పేరు"
          data-placeholder-en="Enter your name"
          required
        >

        <button class="button button-primary enter-button" type="submit">
          <span data-te="ప్రవేశించండి" data-en="Enter GI Creative Space">ప్రవేశించండి</span>
          <span aria-hidden="true">↗</span>
        </button>

        <p class="form-note"
           data-te="మీ ప్రయాణం ఇక్కడ ప్రారంభమవుతుంది."
           data-en="Your journey begins here.">
          మీ ప్రయాణం ఇక్కడ ప్రారంభమవుతుంది.
        </p>
      </form>
    </section>

    <footer class="entrance-footer">
      <span>GI CREATIVE SPACE</span>
      <span>INSPIRED BY IMAGINATION</span>
    </footer>
  </main>

</body>
</html>
